</head>
<body class="page-gallery">
  <!-- header injected by partials.js -->

  <section class="page-hero gallery-hero">
    <div class="container">
      <h1 class="reveal">Photo Gallery</h1>
      <p class="reveal" data-delay="1">Moments from Sampark 2026 — the 1st National Edible Oil Conclave, Guwahati · 19–20 September 2026.</p>
      <span class="gallery-count reveal" data-delay="2" id="galleryCount" aria-live="polite"></span>
    </div>
  </section>

  <section class="gallery-section">
    <div class="gallery-grid" id="galleryGrid" aria-label="Conclave photographs"><!-- tiles injected by gallery.js --></div>
  </section>

  <!-- Lightbox -->
  <div class="glb" id="galleryLightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <div class="glb__top">
      <span class="glb__count" id="glbCount"></span>
      <div class="glb__tools">
        <a class="glb__btn" id="glbDownload" href="#" download aria-label="Download photo" title="Download">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <button type="button" class="glb__btn" id="glbClose" aria-label="Close" title="Close (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="glb__stage" id="glbStage">
      <img class="glb__img" id="glbImg" alt="" />
      <span class="glb__spinner" aria-hidden="true"></span>
    </div>
    <button type="button" class="glb__arrow glb__arrow--prev" id="glbPrev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="glb__arrow glb__arrow--next" id="glbNext" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- footer, floating CTA, modal & credit bar injected by partials.js -->
  <script src="/js/partials.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/enhance.js"></script>
  <script src="/js/gallery.js"></script>
</body>
</html>
